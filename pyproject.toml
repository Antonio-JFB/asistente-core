[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asistente-core"
version = "0.4.0"
description = "Núcleo reutilizable del asistente de datos (chat + reportes) para dashboards FastAPI y Django"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "pydantic",
    "anthropic",
    "ollama",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asistente_core = ["static/*.js"]
